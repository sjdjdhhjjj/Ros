name: Build Complete All-In-One Release

on: [push]

jobs:
  build-windows:
    name: Build All Masters, Agents and Assets for Windows
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build all Python scripts (Masters & Agents)
      run: |
        mkdir -p release_pack/executables
        
        # 遍历 app 目录下的所有 python 文件进行独立打包
        foreach ($file in Get-ChildItem -Path "app" -Filter "*.py") {
            Write-Host "Compiling: $($file.Name)"
            # 使用 --onefile 打包所有脚本，放入 executables 目录
            pyinstaller --onefile --noconsole --distpath ./release_pack/executables "app/$($file.Name)"
        }

    - name: Copy necessary assets and certificates
      run: |
        # 将证书和配置文件（如 cert.pem, key.pem 等）一同复制到发布包中，确保功能完整
        if (Test-Path "app/*.pem") {
            Copy-Item "app/*.pem" "release_pack/"
        }
        if (Test-Path "app/*.txt") {
            Copy-Item "app/*.txt" "release_pack/"
        }
        Write-Host "Assets copied successfully."

    - name: Upload complete release package
      uses: actions/upload-artifact@v4
      with:
        name: Complete-C2-Release-Package
        path: release_pack/
