name: Build Complete All-In-One Release

on: [push]

jobs:
  build-windows:
    name: Build All Masters, Agents and Assets for Windows
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build all Python scripts (Masters & Agents)
      run: |
        mkdir -p release_pack/executables
        
        # 1. 编译所有客户端（agent开头的脚本）：带 --noconsole（无控制台，后台静默运行）
        foreach ($file in Get-ChildItem -Path "app" -Filter "agent_*.py") {
            Write-Host "Compiling Agent (No Console): $($file.Name)"
            pyinstaller --onefile --noconsole --distpath ./release_pack/executables "app/$($file.Name)"
        }
        
        # 2. 编译所有主控端（c2_开头的脚本）：不带 --noconsole（保留控制台，支持交互和输入）
        foreach ($file in Get-ChildItem -Path "app" -Filter "c2_*.py") {
            Write-Host "Compiling Master (With Console): $($file.Name)"
            pyinstaller --onefile --distpath ./release_pack/executables "app/$($file.Name)"
        }

    - name: Copy necessary assets and certificates
      run: |
        if (Test-Path "app/*.pem") {
            Copy-Item "app/*.pem" "release_pack/executables/"
        }
        if (Test-Path "app/*.txt") {
            Copy-Item "app/*.txt" "release_pack/executables/"
        }
        Write-Host "Assets copied successfully."

    - name: Upload complete release package
      uses: actions/upload-artifact@v4
      with:
        name: Complete-C2-Release-Package
        path: release_pack/
