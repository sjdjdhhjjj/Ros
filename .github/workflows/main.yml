name: Build All Executables

on: [push]

jobs:
  build-windows:
    name: Build All for Windows
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build all Python scripts
      run: |
        mkdir -p dist_all
        # 遍历 app 目录下的所有 python 文件并打包
        foreach ($file in Get-ChildItem -Path "app" -Filter "*.py") {
            Write-Host "Compiling: $($file.Name)"
            pyinstaller --onefile --noconsole --distpath ./dist_all "app/$($file.Name)"
        }

    - name: Upload all artifacts
      uses: actions/upload-artifact@v4
      with:
        name: all-executables
        path: dist_all/*.exe
